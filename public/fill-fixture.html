<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>本地代填隔离验收目标</title><style>body{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;margin:36px;color:#283247;background:#f7f8fb}h1{font-size:22px}label{display:block;margin:15px 0}input,button{font:inherit;border:1px solid #dce1eb;padding:10px;border-radius:6px}input{display:block;width:90%;margin-top:6px}p{color:#8b95a5;font-size:12px}input[readonly]{background:#e9ecf1}</style></head><body><h1>本地代填隔离验收目标</h1><p>仅使用虚构凭据；测试输出只包含匹配结果，不包含输入内容。</p><form id="form"><label>账号<input id="account" autocomplete="off"></label><label>密码<input id="password" type="password" autocomplete="off"></label><label>API Key<input id="api" autocomplete="off"></label><label>Token<input id="token" autocomplete="off"></label><label>界面保存的凭据<input id="ui" autocomplete="off"></label><label>协议服务地址<input id="service" autocomplete="off"></label><label>另一个字段<input id="other" autocomplete="off"></label><label>只读字段<input id="readonly" readonly value="readonly fixture"></label><button id="button" type="button">非输入控件</button></form><script src="fill-fixture.js"></script></body></html>
